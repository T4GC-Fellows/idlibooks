# =============================================================================
# Idlibook CI/CD Pipeline
# =============================================================================
# Triggers when a PR is merged to 'develop' branch.
#
# Pipeline Stages:
#   1. CI — Security scanning (Semgrep + pip-audit + pre-commit)
#   2. Approval — Manual approval from PrasanaKumarA
#   3. CD — Deploy to production server via SSH
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

concurrency:
  group: cicd-pipeline-${{ github.sha }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Job 1: CI — Security Scan & Code Quality
# ---------------------------------------------------------------------------
jobs:
  security-scan:
    name: "🔍 Security Scan & Code Quality"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate scanning

      # ── Setup Python ─────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # ── Setup Node ───────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          check-latest: true

      # ── Cache pip packages ───────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── Pre-commit hooks (ruff, eslint, prettier) ───────────
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.0

      # ── Install Semgrep ──────────────────────────────────────
      - name: Install Semgrep
        run: pip install semgrep

      # ── Semgrep: Custom hardcoded secrets scan ───────────────
      - name: "Semgrep: Hardcoded Secrets Detection"
        run: |
          echo "🔐 Scanning for hardcoded API keys, passwords, tokens..."
          semgrep scan \
            --config .github/semgrep-rules/hardcoded-secrets.yml \
            --error \
            --verbose \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='*.min.js' \
            --exclude='*.bundle.js'

      # ── Semgrep: Frappe-specific security rules ──────────────
      - name: "Semgrep: Frappe Security Rules"
        run: |
          echo "🛡️ Running Frappe-specific security rules..."
          git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules
          semgrep scan \
            --config ./frappe-semgrep-rules/rules \
            --error \
            --verbose \
            --exclude='node_modules' \
            --exclude='.git'

      # ── Semgrep: Python correctness rules ────────────────────
      - name: "Semgrep: Python Correctness"
        run: |
          echo "🐍 Running Python correctness rules..."
          semgrep scan \
            --config "r/python.lang.correctness" \
            --error \
            --verbose \
            --exclude='node_modules' \
            --exclude='.git'

      # ── Semgrep: Generic secrets registry rules ──────────────
      - name: "Semgrep: Generic Secrets Registry"
        run: |
          echo "🔑 Scanning for generic secrets patterns..."
          semgrep scan \
            --config "r/generic.secrets" \
            --error \
            --verbose \
            --exclude='node_modules' \
            --exclude='.git'

      # ── pip-audit: Dependency vulnerability check ────────────
      - name: "pip-audit: Vulnerable Dependency Check"
        run: |
          echo "📦 Auditing Python dependencies for vulnerabilities..."
          pip install pip-audit
          pip-audit --desc on .

      # ── Summary ──────────────────────────────────────────────
      - name: CI Summary
        if: success()
        run: |
          echo "✅ All security scans passed successfully!"
          echo ""
          echo "  ✓ Pre-commit hooks (ruff, eslint, prettier)"
          echo "  ✓ Semgrep — Hardcoded secrets detection"
          echo "  ✓ Semgrep — Frappe security rules"
          echo "  ✓ Semgrep — Python correctness"
          echo "  ✓ Semgrep — Generic secrets registry"
          echo "  ✓ pip-audit — Dependency vulnerabilities"

  # ---------------------------------------------------------------------------
  # Job 2: Approval Gate — Manual review by PrasanaKumarA
  # ---------------------------------------------------------------------------
  approval-gate:
    name: "🔒 Approval Gate"
    runs-on: ubuntu-latest
    needs: security-scan
    environment:
      name: production
    steps:
      - name: Approval confirmed
        run: |
          echo "✅ Deployment approved by authorized reviewer."
          echo "   Approved at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "   Commit SHA: ${{ github.sha }}"
          echo "   Triggered by: ${{ github.actor }}"

  # ---------------------------------------------------------------------------
  # Job 3: CD — Deploy to Production
  # ---------------------------------------------------------------------------
  deploy:
    name: "🚀 Deploy to Production"
    runs-on: ubuntu-latest
    needs: approval-gate
    environment:
      name: production

    steps:
      # ── Setup SSH ────────────────────────────────────────────
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # ── Deploy via SSH ───────────────────────────────────────
      - name: Deploy to production server
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          BENCH_PATH: ${{ secrets.DEPLOY_BENCH_PATH }}
          SITE_NAME: ${{ secrets.DEPLOY_SITE_NAME }}
        run: |
          echo "🚀 Starting deployment..."
          echo "   Target: ${SSH_USER}@${SSH_HOST}"
          echo "   Bench:  ${BENCH_PATH}"
          echo "   Site:   ${SITE_NAME}"
          echo ""

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${SSH_USER}@${SSH_HOST} << DEPLOY_SCRIPT
            set -euo pipefail

            echo "=========================================="
            echo "[$(date)] Deployment started via CI/CD"
            echo "=========================================="

            # Navigate to app directory
            cd ${BENCH_PATH}/apps/idli_book

            # Pull latest code from develop
            echo "📥 Pulling latest code from develop..."
            git fetch upstream
            git checkout develop
            git reset --hard upstream/develop

            # Navigate to bench root
            cd ${BENCH_PATH}

            # Install any new dependencies
            echo "📦 Installing dependencies..."
            bench setup requirements

            # Run database migrations
            echo "🔄 Running migrations..."
            bench --site ${SITE_NAME} migrate

            # Build frontend assets
            echo "🏗️ Building assets..."
            bench build --app idli_book

            # Clear cache
            echo "🧹 Clearing cache..."
            bench --site ${SITE_NAME} clear-cache

            echo "=========================================="
            echo "[$(date)] ✅ Deployment completed!"
            echo "=========================================="
          DEPLOY_SCRIPT

      # ── Cleanup SSH ──────────────────────────────────────────
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # ── Deployment Summary ───────────────────────────────────
      - name: Deployment summary
        if: success()
        run: |
          echo "🎉 Deployment successful!"
          echo ""
          echo "  📋 Summary:"
          echo "  ─────────────────────────────────────"
          echo "  Commit:    ${{ github.sha }}"
          echo "  Branch:    develop"
          echo "  Actor:     ${{ github.actor }}"
          echo "  Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "  ─────────────────────────────────────"
