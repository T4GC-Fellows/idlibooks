# =============================================================================
# Idlibook Security CI Pipeline
# =============================================================================
# Triggers when code is pushed to ANY branch.
#
# Pipeline Stages:
#   1. CI — Security scanning (Semgrep + pip-audit + pre-commit)
# =============================================================================

name: CI Pipeline

on:
  push:
    branches:
      - '**'

concurrency:
  group: ci-pipeline-${{ github.sha }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Job 1: CI — Security Scan & Code Quality
# ---------------------------------------------------------------------------
jobs:
  security-scan:
    name: "🔍 Security Scan & Code Quality"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate scanning

      # ── Setup Python ─────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # ── Setup Node ───────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          check-latest: true

      # ── Cache pip packages ───────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── Pre-commit hooks (ruff, eslint, prettier) ───────────
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.0

      # ── Install Semgrep ──────────────────────────────────────
      - name: Install Semgrep
        run: pip install semgrep

      # ── Semgrep: Custom hardcoded secrets scan ───────────────
      - name: "Semgrep: Hardcoded Secrets Detection"
        run: |
          echo "🔐 Scanning for hardcoded API keys, passwords, tokens..."
          semgrep scan \
            --config .github/semgrep-rules/hardcoded-secrets.yml \
            --error \
            --verbose \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='*.min.js' \
            --exclude='*.bundle.js'

      # ── Semgrep: Frappe-specific security rules ──────────────
      - name: "Semgrep: Frappe Security Rules"
        run: |
          echo "🛡️ Running Frappe-specific security rules..."
          git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules
          semgrep scan \
            --config ./frappe-semgrep-rules/rules \
            --error \
            --verbose \
            --exclude='node_modules' \
            --exclude='.git'

      # ── Semgrep: Python correctness rules ────────────────────
      - name: "Semgrep: Python Correctness"
        run: |
          echo "🐍 Running Python correctness rules..."
          semgrep scan \
            --config "r/python.lang.correctness" \
            --error \
            --verbose \
            --exclude='node_modules' \
            --exclude='.git'

      # ── Semgrep: Generic secrets registry rules ──────────────
      - name: "Semgrep: Generic Secrets Registry"
        run: |
          echo "🔑 Scanning for generic secrets patterns..."
          semgrep scan \
            --config "r/generic.secrets" \
            --error \
            --verbose \
            --exclude='node_modules' \
            --exclude='.git'

      # ── pip-audit: Dependency vulnerability check ────────────
      - name: "pip-audit: Vulnerable Dependency Check"
        run: |
          echo "📦 Auditing Python dependencies for vulnerabilities..."
          pip install pip-audit
          pip-audit --desc on .

      # ── Summary ──────────────────────────────────────────────
      - name: CI Summary
        if: success()
        run: |
          echo "✅ All security scans passed successfully!"
          echo ""
          echo "  ✓ Pre-commit hooks (ruff, eslint, prettier)"
          echo "  ✓ Semgrep — Hardcoded secrets detection"
          echo "  ✓ Semgrep — Frappe security rules"
          echo "  ✓ Semgrep — Python correctness"
          echo "  ✓ Semgrep — Generic secrets registry"
          echo "  ✓ pip-audit — Dependency vulnerabilities"
