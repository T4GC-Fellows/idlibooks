rules:
  # ──────────────────────────────────────────────────────────────
  # Rule 1: Hardcoded API Keys / Tokens
  # Catches: api_key = "...", API_KEY = "...", apiToken = "...", etc.
  # ──────────────────────────────────────────────────────────────
  - id: hardcoded-api-key
    patterns:
      - pattern-either:
          # Python assignments
          - pattern: $VAR = "..."
          - pattern: $VAR = '...'
    message: >
      Hardcoded API key or token detected in variable '$VAR'.
      Store secrets in environment variables or a secrets manager instead.
    metadata:
      category: security
      confidence: MEDIUM
      impact: HIGH
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
    languages: [python]
    severity: ERROR
    pattern-regex: "(?i)(api_?key|api_?token|api_?secret|access_?key|auth_?token|bearer_?token)\\s*=\\s*['\"][^'\"]{8,}['\"]"

  # ──────────────────────────────────────────────────────────────
  # Rule 2: Hardcoded API Keys in JavaScript
  # ──────────────────────────────────────────────────────────────
  - id: hardcoded-api-key-js
    patterns:
      - pattern-either:
          - pattern: const $VAR = "..."
          - pattern: let $VAR = "..."
          - pattern: var $VAR = "..."
          - pattern: const $VAR = '...'
          - pattern: let $VAR = '...'
          - pattern: var $VAR = '...'
    message: >
      Hardcoded API key or token detected in JavaScript variable '$VAR'.
      Use environment variables or a configuration service instead.
    metadata:
      category: security
      confidence: MEDIUM
      impact: HIGH
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
    languages: [javascript]
    severity: ERROR
    pattern-regex: "(?i)(api_?key|api_?token|api_?secret|access_?key|auth_?token|bearer_?token)\\s*=\\s*['\"][^'\"]{8,}['\"]"

  # ──────────────────────────────────────────────────────────────
  # Rule 3: Hardcoded Passwords / Secrets
  # ──────────────────────────────────────────────────────────────
  - id: hardcoded-password
    pattern-regex: "(?i)(password|passwd|pwd|secret|secret_?key|db_?password|db_?pass|mysql_?password|root_?password)\\s*=\\s*['\"][^'\"]{4,}['\"]"
    message: >
      Hardcoded password or secret detected.
      Never hardcode credentials — use environment variables, GitHub Secrets, or a vault.
    metadata:
      category: security
      confidence: HIGH
      impact: CRITICAL
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
        - "CWE-259: Use of Hard-coded Password"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
    languages: [python, javascript]
    severity: ERROR
    paths:
      exclude:
        - "**/test_*"
        - "**/*_test.*"
        - "**/conftest.py"
        - "**/fixtures/**"

  # ──────────────────────────────────────────────────────────────
  # Rule 4: Hardcoded Database Connection Strings
  # ──────────────────────────────────────────────────────────────
  - id: hardcoded-connection-string
    pattern-regex: "(?i)(mysql|postgres|postgresql|mongodb|redis|mariadb)://[^\\s'\"]{10,}"
    message: >
      Hardcoded database connection string with embedded credentials detected.
      Use environment variables for connection strings.
    metadata:
      category: security
      confidence: HIGH
      impact: CRITICAL
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
    languages: [python, javascript, json]
    severity: ERROR
    paths:
      exclude:
        - "**/test_*"
        - "**/*_test.*"
        - "**/*.md"

  # ──────────────────────────────────────────────────────────────
  # Rule 5: AWS Access Key ID Pattern
  # Catches: AKIA followed by 16 uppercase alphanumeric characters
  # ──────────────────────────────────────────────────────────────
  - id: hardcoded-aws-access-key
    pattern-regex: "(?<![A-Za-z0-9/+=])AKIA[0-9A-Z]{16}(?![A-Za-z0-9/+=])"
    message: >
      Potential AWS Access Key ID detected (AKIA...).
      Remove this immediately and rotate the key. Use IAM roles or GitHub Secrets.
    metadata:
      category: security
      confidence: HIGH
      impact: CRITICAL
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
    languages: [generic]
    severity: ERROR

  # ──────────────────────────────────────────────────────────────
  # Rule 6: Generic Secret / Private Key Patterns
  # ──────────────────────────────────────────────────────────────
  - id: hardcoded-private-key
    pattern-regex: "-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
    message: >
      Private key block detected in source code.
      Never commit private keys to version control. Use a secrets manager.
    metadata:
      category: security
      confidence: HIGH
      impact: CRITICAL
      cwe:
        - "CWE-321: Use of Hard-coded Cryptographic Key"
    languages: [generic]
    severity: ERROR

  # ──────────────────────────────────────────────────────────────
  # Rule 7: JWT Secret Key Hardcoded
  # ──────────────────────────────────────────────────────────────
  - id: hardcoded-jwt-secret
    pattern-regex: "(?i)(jwt_?secret|jwt_?key|signing_?key|token_?secret)\\s*=\\s*['\"][^'\"]{8,}['\"]"
    message: >
      Hardcoded JWT secret key detected.
      Use environment variables or a secrets manager for JWT signing keys.
    metadata:
      category: security
      confidence: HIGH
      impact: CRITICAL
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
    languages: [python, javascript]
    severity: ERROR

  # ──────────────────────────────────────────────────────────────
  # Rule 8: Frappe/ERPNext-specific — Hardcoded site_config values
  # ──────────────────────────────────────────────────────────────
  - id: hardcoded-frappe-credentials
    pattern-regex: "(?i)(encryption_key|db_password|admin_password|mail_password|rq_password)\\s*[=:]\\s*['\"][^'\"]{4,}['\"]"
    message: >
      Hardcoded Frappe/ERPNext credential detected.
      These values should come from site_config.json (which is gitignored) or environment variables.
    metadata:
      category: security
      confidence: HIGH
      impact: CRITICAL
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
    languages: [python, javascript, json]
    severity: ERROR
    paths:
      exclude:
        - "**/test_*"
        - "**/*_test.*"
